		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
	</head>
	
	<body class="m-0" itemscope itemtype="http://schema.org/WebPage">
		<div class="container-fluid">
			<div class="textContent row align-items-sm-center justify-content-between py-5 m-0">
				
				<div class="text-center">
					<img class="logo" src="images/logo.png">

					<p class="mt-2">"Sito in aggiornamento - Work in progress".</p>
				</div>

				<div class="divEnd d-sm-flex align-items-start justify-content-center">
					<div class="pr-sm-5">
						<p><strong>Casa Girelli S.P.A.</strong>
						Viale Verona, 182 38123 Trento (TN)
						P.I./C.F. 00203860226
						Registro Imp. Trento N. REA TN-69728</p>
					</div>

					<div class="pl-sm-5 mt-sm-0 mt-4">
						<p><strong>Contacts</strong>
						phone: <a href="tel:+390461380800">+39 0461.380.800</a>
						Fax. <a href="tel:+390461380846">+39 0461.380.846</a>

		<style>
			/* Utility generiche */
			@font-face {
				font-family: "Magnify";
				src: url("fonts/Magnify-Regular.ttf");
			}
			@font-face {
				font-family: "Magnify";
				src: url("fonts/Magnify-Bold.ttf");
				font-weight: bold;
			}
 			body {
				position: relative;
				font-family: 'Magnify', sans-serif;
				color: #222; /* Nero */
				background: white;
				font-weight: 400;
				overflow-x: hidden !important;
				-webkit-overflow-x: hidden !important;
				z-index: 1;
			}
			p {
				font-size: 1.15em;
				font-weight: 400;
				margin-bottom: unset;
				white-space: pre-line;
			}
			.container-fluid {
				max-width: 1600px;
				padding: 0 30px;
			}
			.row {
				width: 100%;
			}
			.textContent {
				flex-direction: column;
				min-height: 100vh;
			}
			.divEnd p {
				font-size: 1em;
			}
			.divEnd p a {
				color: #222; /* Nero */
				text-decoration: underline;
				transition: 0.3s ease;
			}
			.divEnd p a:hover {
				color: #f6a21d; /* Giallo */
				text-decoration: unset;
			}
			/* MEDIA QUERY */
			@media (max-width: 576px) {
				p {
					font-size: 1em;
				}
				.divEnd p {
					font-size: 0.8em;
				}
			}
		</style>
